name: 'Package OSSIA Addon'
description: 'Packages OSSIA addon artifacts for distribution'
inputs:
  addon-path:
    description: 'Path to addon source (for metadata)'
    required: false
    default: '.'
  output-path:
    description: 'Path where to create the package'
    required: false
    default: 'deploy'

runs:
  using: 'composite'
  steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create package directory
      shell: bash
      run: |
        mkdir -p ${{ inputs.output-path }}

    - name: Collect binaries
      shell: bash
      run: |
        find . -name '*.so' -exec cp {} ${{ inputs.output-path }}/ \;
        find . -name '*.dylib' -exec cp {} ${{ inputs.output-path }}/ \;
        find . -name '*.dll' -exec cp {} ${{ inputs.output-path }}/ \;

    # The architecture keys below must match score::addonArchitecture()
    # (src/lib/score/plugins/Addon.cpp). score::makeAddon() looks the library up
    # by that key and, if it does not find one -- or if "name" or a 36-character
    # "key" uuid is missing -- discards the add-on without a word.
    - name: Create addon manifest
      shell: bash
      run: |
        set -euo pipefail

        ADDON_PATH='${{ inputs.addon-path }}'
        OUTPUT_PATH='${{ inputs.output-path }}'

        if [[ ! -f "$ADDON_PATH/addon.json" ]]; then
          echo "::error::$ADDON_PATH/addon.json is missing, so the package would ship without a localaddon.json and score could not load it."
          exit 1
        fi

        WIN32_PLUGIN=$(find "$OUTPUT_PATH" -name '*.dll' -exec basename {} \; | head -1)
        LINUX_PLUGIN=$(find "$OUTPUT_PATH" -name '*.so' -exec basename {} \; | head -1)
        MACOS_PLUGIN=$(find "$OUTPUT_PATH" -name '*.dylib' -exec basename {} \; | head -1)

        if [[ -z "$WIN32_PLUGIN$LINUX_PLUGIN$MACOS_PLUGIN" ]]; then
          echo "::error::no add-on library was collected into $OUTPUT_PATH."
          exit 1
        fi

        # An empty value would name the package directory itself, so only the
        # platforms that actually built get a key.
        jq \
          --arg win64 "$WIN32_PLUGIN" \
          --arg linux64 "$LINUX_PLUGIN" \
          --arg darwin64 "$MACOS_PLUGIN" \
          '. + (if $win64 == "" then {} else { "windows-x86_64": $win64 } end)
             + (if $linux64 == "" then {} else { "linux-x86_64": $linux64 } end)
             + (if $darwin64 == "" then {} else { "darwin-aarch64": $darwin64 } end)' \
          "$ADDON_PATH/addon.json" > "$OUTPUT_PATH/localaddon.json"

        NAME=$(jq -r '.name // ""' "$OUTPUT_PATH/localaddon.json")
        KEY=$(jq -r '.key // ""' "$OUTPUT_PATH/localaddon.json")
        if [[ -z "$NAME" ]]; then
          echo "::error::$ADDON_PATH/addon.json has no \"name\"; score would discard the add-on silently."
          exit 1
        fi
        if [[ ${#KEY} -ne 36 ]]; then
          echo "::error::$ADDON_PATH/addon.json has no 36-character \"key\" uuid (got '$KEY'); score would discard the add-on silently."
          exit 1
        fi

    - name: Copy metadata files
      shell: bash
      run: |
        if [[ -f "${{ inputs.addon-path }}/LICENSE" ]]; then
          cp -f "${{ inputs.addon-path }}/LICENSE" "${{ inputs.output-path }}/"
        fi
        if [[ -f "${{ inputs.addon-path }}/LICENSE.txt" ]]; then
          cp -f "${{ inputs.addon-path }}/LICENSE.txt" "${{ inputs.output-path }}/"
        fi
        if [[ -f "${{ inputs.addon-path }}/README.md" ]]; then
          cp -f "${{ inputs.addon-path }}/README.md" "${{ inputs.output-path }}/"
        fi
        if [[ -f "${{ inputs.addon-path }}/README" ]]; then
          cp -f "${{ inputs.addon-path }}/README" "${{ inputs.output-path }}/"
        fi

    - name: Display package contents
      shell: bash
      run: |
        echo "Package contents:"
        ls -la ${{ inputs.output-path }}/
        if [[ -f "${{ inputs.output-path }}/localaddon.json" ]]; then
          echo "Addon manifest:"
          cat "${{ inputs.output-path }}/localaddon.json"
        fi